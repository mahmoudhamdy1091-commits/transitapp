<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="135%" y2="135%">
      <stop offset="0%" style="stop-color:#1A7F4E"/>
      <stop offset="100%" style="stop-color:#0F5C38"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#4CC98F;stop-opacity:0"/>
      <stop offset="20%"  style="stop-color:#CFEFDF;stop-opacity:1"/>
      <stop offset="80%"  style="stop-color:#F3FBF7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F3FBF7;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#0F5C38;stop-opacity:0"/>
      <stop offset="50%"  style="stop-color:#6FE0A8;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#0F5C38;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- خلفية -->
  <rect width="200" height="200" rx="38" ry="38" fill="url(#bg)"/>

  <!-- توهج خفيف في المنتصف -->
  <ellipse cx="100" cy="95" rx="75" ry="50" fill="#35C088" opacity="0.15"/>

  <!-- ═══════════════════════════════════
       الكرة الأرضية بنفس أسلوب الشاحنة
       خطوط طول وعرض + مسار شحن متقطع
       ثم تتحول لحروف TIC
  ═══════════════════════════════════ -->

  <!-- خطوط إشارة/مدار خلف الكرة (motion lines) -->
  <line x1="14" y1="78" x2="34" y2="78" stroke="#2E9E68" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="86" x2="34" y2="86" stroke="#26895A" stroke-width="1" stroke-linecap="round"/>
  <line x1="16" y1="94" x2="34" y2="94" stroke="#2E9E68" stroke-width="1.5" stroke-linecap="round"/>

  <!-- الكرة الأرضية — الإطار الخارجي -->
  <circle cx="100" cy="80" r="26" fill="none" stroke="url(#line)" stroke-width="2.2"/>

  <!-- خط الاستواء -->
  <ellipse cx="100" cy="80" rx="26" ry="8" fill="none" stroke="#CFEFDF" stroke-width="1.5" opacity="0.7"/>

  <!-- خطوط عرض إضافية -->
  <ellipse cx="100" cy="68" rx="22" ry="5" fill="none" stroke="#CFEFDF" stroke-width="1" opacity="0.35"/>
  <ellipse cx="100" cy="92" rx="22" ry="5" fill="none" stroke="#CFEFDF" stroke-width="1" opacity="0.35"/>

  <!-- خط الطول المركزي -->
  <line x1="100" y1="54" x2="100" y2="106" stroke="#CFEFDF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- خطوط طول جانبية -->
  <path d="M 100 54 C 82 64, 82 96, 100 106" fill="none" stroke="#CFEFDF" stroke-width="1" opacity="0.45"/>
  <path d="M 100 54 C 118 64, 118 96, 100 106" fill="none" stroke="#CFEFDF" stroke-width="1" opacity="0.45"/>

  <!-- بريق خفيف على سطح الكرة -->
  <ellipse cx="90" cy="70" rx="7" ry="4" fill="#CFEFDF" opacity="0.15" transform="rotate(-20 90 70)"/>

  <!-- علامة ميناء المنشأ -->
  <circle cx="77" cy="98" r="3" fill="#E8B23D" opacity="0.85"/>

  <!-- مسار الشحن المتقطع نحو الوجهة -->
  <path d="M 119 60 Q 150 40 168 46" fill="none" stroke="#F3FBF7" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 3.5" opacity="0.8"/>
  <circle cx="170" cy="45" r="4" fill="#F3FBF7" opacity="0.25"/>
  <circle cx="170" cy="45" r="2.3" fill="#F3FBF7" opacity="0.9"/>
  <line x1="170" y1="45" x2="178" y2="39" stroke="#F3FBF7" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  <line x1="170" y1="45" x2="180" y2="47" stroke="#F3FBF7" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>

  <!-- علامات الموانئ — بدل العجلات -->
  <circle cx="66" cy="106" r="4" fill="#0F5C38" stroke="#CFEFDF" stroke-width="1.2"/>
  <circle cx="66" cy="106" r="2" fill="#145A38"/>
  <circle cx="66" cy="106" r="0.9" fill="#CFEFDF"/>

  <circle cx="100" cy="106" r="4" fill="#0F5C38" stroke="#CFEFDF" stroke-width="1.2"/>
  <circle cx="100" cy="106" r="2" fill="#145A38"/>
  <circle cx="100" cy="106" r="0.9" fill="#CFEFDF"/>

  <circle cx="134" cy="106" r="4" fill="#0F5C38" stroke="#CFEFDF" stroke-width="1.2"/>
  <circle cx="134" cy="106" r="2" fill="#145A38"/>
  <circle cx="134" cy="106" r="0.9" fill="#CFEFDF"/>

  <!-- خط الأرضية -->
  <line x1="40" y1="115" x2="160" y2="115" stroke="#1F6B48" stroke-width="2" stroke-linecap="round"/>

  <!-- ═══ خط فاصل ═══ -->
  <line x1="30" y1="124" x2="170" y2="124" stroke="url(#glow)" stroke-width="1"/>

  <!-- ═══ حروف TIC ═══ -->
  <text x="100" y="151"
    font-family="'Trebuchet MS', 'Century Gothic', Futura, sans-serif"
    font-size="28"
    font-weight="700"
    fill="#F9F8F6"
    text-anchor="middle"
    letter-spacing="10"
    style="font-stretch:condensed">TIC</text>

  <!-- ═══ النص الصغير ═══ -->
  <text x="100" y="172"
    font-family="Arial, sans-serif"
    font-size="8.5"
    fill="#9FCDB3"
    text-anchor="middle"
    letter-spacing="2.5">FOR TRANSPORT GOODS</text>

  <!-- نقاط تزيينية -->
  <circle cx="18" cy="81" r="1.2" fill="#2E9E68" opacity="0.8"/>
  <circle cx="13" cy="88" r="0.9" fill="#26895A" opacity="0.6"/>
  <circle cx="20" cy="96" r="1.2" fill="#2E9E68" opacity="0.8"/>

</svg>
