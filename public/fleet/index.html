<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>الترانزيت الدولي لنقل البضائع</title>
  <link rel="manifest" href="/fleet/manifest.json">
  <meta name="theme-color" content="#44403C">
  <!-- قراءة فقط لملفات الألوان/الهيكل الأصلية — نفس القيم بالحرف، بدون نسخ
       (§3 بند 15). mobile.css مطلوب هنا عشان درج القائمة الجانبية على
       الموبايل (Phase 7) يشتغل — من غيره .sidebar بتفضل نسخة الديسكتوب بس. -->
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/mobile.css">
  <link rel="stylesheet" href="/fleet/css/fleet.css">
</head>
<body>
  <!-- فحص جلسة فوري قبل أي رسم — لو مفيش توكن، رجوع مباشر للوجين الرئيسي.
       هذا سكريبت كلاسيكي (مش module) عمدًا: لازم يشتغل فورًا synchronous
       قبل أي رسم محتوى، بدل ما ينتظر دور الـmodule (deferred بطبيعته). -->
  <script>
    if (!localStorage.getItem('tm_token') || !localStorage.getItem('tm_user')) {
      window.location.href = '/';
    }
  </script>

  <!-- بنية Phase 7: app-layout/sidebar/main-area/top-bar/content-area —
       نفس هيكل BOX/TM الحقيقي بالحرف (public/index.html)، كلاسات مُعاد
       استخدامها من styles.css/mobile.css مباشرة، صفر تعريف جديد هنا. -->
  <div class="app-layout" id="fleetShell" style="display:none">

    <div id="sidebarBackdrop" class="sidebar-backdrop" onclick="closeMobileSidebar()" style="display:none"></div>

    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="/fleet/icon.svg" alt="TIC" style="width:36px;height:36px;border-radius:10px;flex-shrink:0">
          <div>
            <div class="s-title">الترانزيت الدولي</div>
            <div class="s-sub">For Transport Goods</div>
          </div>
        </div>
      </div>

      <div class="sidebar-nav">
        <div class="nav-section nav-section-fixed">
          <div class="nav-section-items open">
            <a class="nav-item" href="#dashboard" data-route="dashboard"><span class="ni-icon">📊</span><span>الداشبورد</span></a>
            <a class="nav-item" href="#journal" data-route="journal"><span class="ni-icon">📅</span><span>اليومية</span></a>
          </div>
        </div>

        <div class="nav-section">
          <div class="nav-section-title open" onclick="toggleNav(this)">
            <span>🚛 الأسطول</span><span class="ns-arrow">▼</span>
          </div>
          <div class="nav-section-items open">
            <a class="nav-item" href="#vehicles" data-route="vehicles"><span class="ni-icon">🚚</span><span>السيارات</span></a>
            <a class="nav-item" href="#drivers" data-route="drivers"><span class="ni-icon">👤</span><span>السائقين</span></a>
          </div>
        </div>

        <div class="nav-section">
          <div class="nav-section-title open" onclick="toggleNav(this)">
            <span>💰 الماليات</span><span class="ns-arrow">▼</span>
          </div>
          <div class="nav-section-items open">
            <a class="nav-item" href="#revenue" data-route="revenue"><span class="ni-icon">🧾</span><span>الإيرادات</span></a>
            <a class="nav-item" href="#expenses" data-route="expenses"><span class="ni-icon">💸</span><span>المصروفات</span></a>
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="fleet-btn primary" id="fleetSwitchCompanyBtn" type="button" style="width:100%;margin-bottom:10px;justify-content:center">🏠 الصفحة الرئيسية</button>
        <div class="user-info">
          <div class="user-avatar" id="userAvatar"></div>
          <div>
            <div class="user-name" id="fleetUserName"></div>
            <div class="user-email" id="fleetUserEmail"></div>
          </div>
          <button class="btn-logout" id="fleetLogoutBtn" type="button" title="تسجيل الخروج">⏏</button>
        </div>
      </div>
    </aside>

    <div class="main-area">
      <div class="top-bar">
        <button class="mobile-menu-btn" id="fleetMobileMenuBtn" type="button" aria-label="القائمة">☰</button>
        <div class="top-bar-title-wrap">
          <div class="top-bar-title" id="fleetTopBarTitle">الداشبورد</div>
        </div>
      </div>
      <!-- هدف الراوتر الوحيد — الشل حواليه ثابت، مبيتمسحش مع أي تنقل -->
      <div class="content-area" id="fleetMain">
        <div class="fleet-loading">جاري التحميل...</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { state, fleetLogout } from '/fleet/js/fleet-core.js';
    import { toggleNav, toggleMobileSidebar, closeMobileSidebar } from '/fleet/js/fleet-ui.js';
    import { registerRoute, initRouter } from '/fleet/js/fleet-router.js';
    import { renderVehiclesList, renderVehicleDetail } from '/fleet/js/fleet-vehicles.js';
    import { renderDriversList, renderDriverDetail } from '/fleet/js/fleet-drivers.js';
    import { renderDashboard, renderRevenueList, renderExpensesList } from '/fleet/js/fleet-dashboard.js';
    import { renderJournal } from '/fleet/js/fleet-journal.js';

    // onclick="toggleNav(this)"/"closeMobileSidebar()" في الـHTML فوق محتاجين
    // الدوال دي على window — نفس أسلوب js/utils.js (window bridge) بالحرف.
    window.toggleNav = toggleNav;
    window.closeMobileSidebar = closeMobileSidebar;

    if (!state.token || !state.user?.email) {
      window.location.href = '/';
    } else {
      document.getElementById('fleetShell').style.display = 'flex';
      document.getElementById('fleetUserEmail').textContent = state.user?.email || '';
      document.getElementById('fleetUserName').textContent = (state.user?.email || '').split('@')[0];
      document.getElementById('userAvatar').textContent = (state.user?.email || '?')[0].toUpperCase();

      // العلامة دي بتخلّي initApp في الصفحة الرئيسية توّدي مباشرة لشاشة
      // "اختر الشركة" بدل ما تمرّ بمسار الداشبورد العادي أولًا (نفس مفتاح
      // FLEET_HOME_FLAG في js/transactions.js — لازم يتصلحوا مع بعض).
      document.getElementById('fleetSwitchCompanyBtn').onclick = () => {
        sessionStorage.setItem('tm_show_picker', '1');
        window.location.href = '/';
      };
      document.getElementById('fleetLogoutBtn').onclick = fleetLogout;
      document.getElementById('fleetMobileMenuBtn').onclick = toggleMobileSidebar;

      registerRoute('dashboard', renderDashboard);
      registerRoute('vehicles', renderVehiclesList);
      registerRoute('vehicle', renderVehicleDetail);
      registerRoute('drivers', renderDriversList);
      registerRoute('driver', renderDriverDetail);
      registerRoute('revenue', renderRevenueList);
      registerRoute('expenses', renderExpensesList);
      registerRoute('journal', renderJournal);

      const NAV_TITLES = {
        dashboard: 'الداشبورد', journal: 'اليومية', vehicles: 'السيارات',
        vehicle: 'ملف السيارة', drivers: 'السائقين', driver: 'ملف السائق',
        revenue: 'الإيرادات', expenses: 'المصروفات',
      };
      function _updateActiveNav() {
        const current = location.hash.slice(1).split('?')[0] || 'dashboard';
        document.querySelectorAll('.sidebar .nav-item[data-route]').forEach(a => a.classList.toggle('active', a.dataset.route === current));
        document.getElementById('fleetTopBarTitle').textContent = NAV_TITLES[current] || '';
      }
      window.addEventListener('hashchange', _updateActiveNav);

      // إغلاق درج الموبايل تلقائيًا بعد أي تنقل فعلي — نفس تفويض الحدث
      // على .sidebar في js/engine.js init() بالحرف، بدون استيراده.
      document.querySelector('.sidebar')?.addEventListener('click', (e) => {
        if (e.target.closest('.nav-item')) closeMobileSidebar();
      });

      initRouter('dashboard');
      _updateActiveNav();
    }
  </script>
</body>
</html>
